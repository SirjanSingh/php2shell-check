name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, which has no Python 3.9 build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: |
          # PyYAML is optional; with it the Sigma-rule test validates real YAML.
          python -m pip install pyyaml
          python -m unittest discover tests -v
      - name: Smoke-test the CLI
        run: |
          python php2shell_check.py check --version 8.4.26 && exit 1 || true
          python php2shell_check.py check --version 8.4.27
          # 8.3.10 is affected, so these exit 1; assert on the output instead.
          python php2shell_check.py check --version 8.3.10 --json | python -c "import json,sys; assert json.load(sys.stdin)['installs'][0]['affected']"
          python php2shell_check.py check --version 8.3.10 --sarif | python -c "import json,sys; json.load(sys.stdin)"
          python php2shell_check.py check --version 8.4.26 --fail-on none
          python php2shell_check.py harden
          printf 'FROM php:8.3.10-fpm\n' > Dockerfile.ci
          python php2shell_check.py scan-docker Dockerfile.ci && exit 1 || true
          printf 'FROM php:8.3\n' > Dockerfile.float
          python php2shell_check.py scan-docker Dockerfile.float --fail-on high
          python php2shell_check.py scan-docker Dockerfile.float --fail-on medium && exit 1 || true
          python php2shell_check.py rules > /dev/null
          mkdir sc sc-clean
          echo "ini_set('session.serialize_handler', 'php');" > sc/app.php
          echo "echo 1;" > sc-clean/ok.php
          python php2shell_check.py scan-code sc && exit 1 || true
          python php2shell_check.py scan-code sc --fail-on none
          python php2shell_check.py scan-code sc-clean --fail-on medium
          python php2shell_check.py rules --output rules-out --block
          test -s rules-out/php2shell-modsecurity.conf
          test -s rules-out/php2shell-sigma.yml
          test -s rules-out/php2shell-suricata.rules
          printf -- '-oProxyCommand=x\n' > bad-hosts.txt
          python php2shell_check.py check --ssh-hosts bad-hosts.txt --fail-on high
          python php2shell_check.py check --ssh-hosts bad-hosts.txt --fail-on medium && exit 1 || true
          # Real Docker (the ubuntu runners have it). Images run with --network none.
          rc=0; python php2shell_check.py scan-docker --image php:8.3.10-cli --json > image.json || rc=$?
          test "$rc" = 1
          python -c "import json; assert json.load(open('image.json'))['hits'][0]['affected']"
          python php2shell_check.py scan-docker --image php:8.4.27-cli
          docker run -d --name p2s php:8.3.10-fpm
          # Exits 1 for the affected php and php-fpm, so the JSON is asserted instead.
          python php2shell_check.py scan-docker --running --json > running.json || true
          python -c "import json; hits = json.load(open('running.json'))['hits']; bins = {h['binary'].rsplit('/', 1)[-1] for h in hits if h['source'].startswith('container p2s ')}; assert {'php', 'php-fpm'} <= bins, bins"
      - name: Restart check against a real replaced process
        run: |
          # A copy of bash named phpx stands in for php-fpm. (Not /bin/sleep:
          # newer coreutils is a multi-call binary that rejects a renamed copy.)
          # The trailing `:` stops bash exec-ing sleep, so this process stays phpx.
          cp "$(command -v bash)" /tmp/phpx
          /tmp/phpx -c 'sleep 60; :' &
          PHPX_PID=$!
          sleep 1
          rm /tmp/phpx
          python php2shell_check.py check --no-color && exit 1 || true
          python php2shell_check.py check --json | python -c "import json,sys; d=json.load(sys.stdin); assert 'phpx' in [s['name'] for s in d['stale_processes']], d"
          python php2shell_check.py check --no-restart-check --fail-on none
          kill "$PHPX_PID"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the package
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install the wheel and run the entry point
        run: |
          python -m pip install dist/*.whl
          php2shell-check check --version 8.4.27

  action:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Write a Dockerfile on an affected PHP image
        run: printf 'FROM php:8.3.10-fpm\n' > Dockerfile.ci
      # The action exits 1 here, so the step is allowed to fail and its output is asserted.
      - name: Run the action on an affected Dockerfile
        id: p2s
        uses: ./
        continue-on-error: true
        with:
          command: scan-docker
          args: Dockerfile.ci
      - name: Assert the action exits 1
        env:
          EXIT_CODE: ${{ steps.p2s.outputs.exit-code }}
        run: test "$EXIT_CODE" = 1
      - name: Run the action with fail-on none
        id: p2s-none
        uses: ./
        continue-on-error: true
        with:
          command: scan-docker
          args: Dockerfile.ci
          fail-on: none
      - name: Assert the action exits 0
        env:
          EXIT_CODE: ${{ steps.p2s-none.outputs.exit-code }}
        run: test "$EXIT_CODE" = 0
