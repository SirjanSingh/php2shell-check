[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "php2shell-check"
dynamic = ["version"]
description = "Detect and help remediate the PHP2Shell RCE flaws (CVE-2026-109618 / CVE-2026-109619)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sirjan Singh" }]
keywords = ["php", "security", "cve", "php2shell", "rce", "vulnerability-scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/SirjanSingh/php2shell-check"
Issues = "https://github.com/SirjanSingh/php2shell-check/issues"
Changelog = "https://github.com/SirjanSingh/php2shell-check/blob/main/CHANGELOG.md"

[project.scripts]
php2shell-check = "php2shell_check:main"

[tool.setuptools]
py-modules = ["php2shell_check"]

[tool.setuptools.dynamic]
version = { attr = "php2shell_check.__version__" }
