[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "php2shell-check"
version = "0.1.0"
description = "Detect and help remediate the PHP2Shell RCE flaws (CVE-2026-109618 / CVE-2026-109619)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sirjan Singh" }]
keywords = ["php", "security", "cve", "php2shell", "rce", "vulnerability-scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/SirjanSingh/shiny-php"
Issues = "https://github.com/SirjanSingh/shiny-php/issues"

[project.scripts]
php2shell-check = "php2shell_check:main"

[tool.setuptools]
py-modules = ["php2shell_check"]
